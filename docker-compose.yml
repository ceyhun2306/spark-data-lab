services:
  # ---------------------------------------------------------------
  # MinIO (S3 uyğun object storage)
  # ---------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lake
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------
  # Spark Master
  # ---------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.2
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/sbin/start-master.sh"]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_events:/opt/spark-events
    networks:
      - lake
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------
  # Spark Worker 1
  # ---------------------------------------------------------------
  spark-worker-1:
    image: apache/spark:3.5.2
    container_name: spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    ports:
      - "8081:8081"
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_events:/opt/spark-events
      - ./data:/opt/data:ro
    networks:
      - lake
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Spark Worker 2
  # ---------------------------------------------------------------
  spark-worker-2:
    image: apache/spark:3.5.2
    container_name: spark-worker-2
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    ports:
      - "8082:8082"
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_events:/opt/spark-events
      - ./data:/opt/data:ro
    networks:
      - lake
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Spark History Server
  # ---------------------------------------------------------------
  spark-history:
    image: apache/spark:3.5.2
    container_name: spark-history
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_NO_DAEMONIZE=true
    user: "0:0"
    command: >
      bash -lc "mkdir -p /spark-events &&
                chmod -R 777 /spark-events &&
                /opt/spark/sbin/start-history-server.sh"
    ports:
      - "18080:18080"
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark_events:/spark-events
    networks:
      - lake
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Jupyter (driver)
  # ---------------------------------------------------------------
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.2
    container_name: jupyter
    depends_on:
      spark-master:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/opt/data:ro
      - spark_events:/spark-events
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-lesson-spark-2026}
      - PYSPARK_SUBMIT_ARGS=--master spark://spark-master:7077 --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.13 pyspark-shell
    command: >
      bash -lc "
        if [ ! -x /opt/conda/envs/pyspark38/bin/python ]; then
          conda create -y -n pyspark38 python=3.8 ipykernel;
        fi &&
        /opt/conda/envs/pyspark38/bin/python -m ipykernel install --user --name pyspark38 --display-name 'Python 3.8 (Spark worker-ə uyğun)' &&
        start-notebook.sh
      "
    networks:
      - lake
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8888/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - lake
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  lake:

volumes:
  minio_data:
  spark_events:
  postgres_data: